<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PAGE_TITLE__</title>

<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px 0;font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;color:#222;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.resume-page{width:190mm;min-height:277mm;margin:0 auto;background:#ffffff;box-shadow:0 8px 24px rgba(15,57,112,.12);}
header{background:linear-gradient(120deg,#174a8b,#0f3970);color:white;padding:18px 26px;display:flex;justify-content:space-between;gap:18px;}
.header-left{max-width:118mm;}
.header-left h1{margin:0;font-size:30px;letter-spacing:.4px;font-weight:800;}
.role{margin-top:6px;font-size:13px;font-weight:700;color:#ffc400;text-transform:uppercase;}
.header-right{text-align:right;font-size:12px;line-height:1.55;}
.header-right a{color:white;text-decoration:none;word-break:break-word;}
.content{padding:18px 26px 22px;}
.summary-box{background:#f6f9fd;border-left:4px solid #174a8b;padding:12px 14px;border-radius:6px;font-size:13px;margin-bottom:18px;}
.section-title{font-size:16px;color:#174a8b;text-transform:uppercase;font-weight:800;border-bottom:2px solid #174a8b;padding-bottom:5px;margin:20px 0 12px 0;page-break-after:avoid;}
.certifications-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:6px;page-break-inside:avoid;break-inside:avoid;align-items:start;}
.cert-card{background:#fbfdff;border:1px solid #e1e8f2;border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;page-break-inside:avoid;break-inside:avoid;min-height:140px;}
.cert-badge-svg{width:100%;max-width:92px;height:auto;display:block;}
.cert-label{margin-top:6px;font-size:10px;font-weight:700;line-height:1.25;color:#173b6b;}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.skill-card{background:#f6f9fd;border:1px solid #d9e1ec;border-radius:8px;padding:11px 12px;page-break-inside:avoid;break-inside:avoid;}
.skill-card h3{margin:0 0 5px 0;font-size:11px;color:#e06300;text-transform:uppercase;}
.skill-card p{margin:0;font-size:11.5px;}
.job-block{margin-bottom:18px;page-break-inside:avoid;break-inside:avoid;}
.job-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:5px;}
.job-title{font-weight:700;font-size:14px;}
.company-name{color:#174a8b;font-weight:700;}
.job-meta{font-size:11.5px;color:#666;white-space:nowrap;}
.job-details{font-size:11.25px;color:#444;margin:0 0 7px 0;line-height:1.45;}
.job-details div{margin-bottom:2px;}
ul{margin:0;padding-left:18px;}
li{font-size:11.5px;margin-bottom:4px;}
.tag{color:#174a8b;font-weight:700;}
.bottom-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:18px;}
.bottom-card h3{font-size:13px;color:#174a8b;border-bottom:1px solid #ddd;padding-bottom:4px;margin:0 0 8px 0;}
.bottom-card div{font-size:11.5px;margin-bottom:8px;}
@page{size:A4 portrait;margin:8mm;}
@media print{
html,body{width:210mm;}
body{background:white;padding:0;font-size:11px;line-height:1.32;}
.resume-page{width:194mm;min-height:auto;margin:0 auto;box-shadow:none;}
header{padding:14px 18px;gap:14px;}
.header-left{max-width:118mm;}
.header-left h1{font-size:25px;}
.role{font-size:11.5px;margin-top:4px;}
.header-right{font-size:10.5px;line-height:1.4;}
.content{padding:12px 18px 16px;}
.summary-box{font-size:11.25px;padding:10px 12px;margin-bottom:12px;}
.section-title{font-size:13px;margin:14px 0 8px 0;padding-bottom:4px;border-bottom-width:2px;page-break-after:avoid;break-after:avoid;}
.certifications-grid{grid-template-columns:repeat(5,minmax(0,1fr)) !important;gap:6px;}
.cert-card{min-height:112px;padding:6px 4px;}
.cert-badge-svg{max-width:74px;}
.cert-label{font-size:8.5px;line-height:1.15;margin-top:5px;}
.skills-grid{grid-template-columns:1fr 1fr !important;gap:8px;page-break-inside:auto;}
.skill-card{padding:8px 9px;}
.skill-card h3{font-size:9.5px;margin-bottom:4px;}
.skill-card p{font-size:9.5px;line-height:1.28;}
.job-block{margin-bottom:12px;}
.job-title{font-size:12px;}
.job-meta{font-size:9.5px;}
.job-details{font-size:9.5px;line-height:1.3;margin-bottom:5px;}
ul{padding-left:15px;}
li{font-size:9.6px;line-height:1.26;margin-bottom:2px;}
.bottom-grid{margin-top:12px;}
.bottom-card h3{font-size:11px;}
.bottom-card div{font-size:9.8px;margin-bottom:6px;}
a{text-decoration:none;color:inherit;}
}
@media (max-width:900px){body{padding:0;}.resume-page{width:100%;min-height:auto;box-shadow:none;}.certifications-grid{grid-template-columns:repeat(3,1fr);}.skills-grid{grid-template-columns:1fr;}.header-left{max-width:none;}.job-header{flex-direction:column;}.job-meta{white-space:normal;}}
@media (max-width:560px){.certifications-grid{grid-template-columns:repeat(2,1fr);}.cert-card{min-height:132px;}}
</style>
</head>
<body>
<div class="resume-page">

<div class="header-left">

<div class="role">__HEADLINE__</div>
</div>
<div class="header-right">
__CONTACT_LINES_HTML__
</div>
</header>
<div class="content">
<div class="summary-box">__SUMMARY_HTML__</div>

<h2 class="section-title">Key Platform Achievements</h2>
<ul>

</ul>

</div>

<div class="bottom-grid">

<h3>Education</h3>

</div>
</div>
</div>
</div>
</body>
</html>

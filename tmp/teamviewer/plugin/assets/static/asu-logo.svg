<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">Arizona State University logo</title>
  <desc id="desc">Stylized ASU wordmark with Arizona State University text in maroon and gold.</desc>
  <rect width="640" height="180" fill="none"/>
  <g transform="translate(18 18)">
    <g transform="translate(150 58)">
      <circle r="50" fill="#FFC627"/>
      <g stroke="#FFC627" stroke-width="8" stroke-linecap="round">
        <line x1="0" y1="-82" x2="0" y2="-58"/>
        <line x1="40" y1="-71" x2="28" y2="-50"/>
        <line x1="71" y1="-40" x2="50" y2="-28"/>
        <line x1="82" y1="0" x2="58" y2="0"/>
        <line x1="71" y1="40" x2="50" y2="28"/>
        <line x1="40" y1="71" x2="28" y2="50"/>
        <line x1="0" y1="82" x2="0" y2="58"/>
        <line x1="-40" y1="71" x2="-28" y2="50"/>
        <line x1="-71" y1="40" x2="-50" y2="28"/>
        <line x1="-82" y1="0" x2="-58" y2="0"/>
        <line x1="-71" y1="-40" x2="-50" y2="-28"/>
        <line x1="-40" y1="-71" x2="-28" y2="-50"/>
      </g>
    </g>
    <text x="0" y="104" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="124" letter-spacing="-8" fill="#8C1D40">ASU</text>
    <text x="6" y="140" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="2" fill="#8C1D40">ARIZONA STATE UNIVERSITY</text>
  </g>
</svg>

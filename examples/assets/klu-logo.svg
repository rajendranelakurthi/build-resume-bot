<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">KL University logo</title>
  <desc id="desc">KL University emblem with black gear border and maroon academic seal.</desc>
  <rect width="320" height="320" fill="#ffffff"/>
  <g transform="translate(160 160)">
    <g fill="#1f1f1f">
      <path d="M0-138 14-124 36-128 42-106 64-100 62-78 84-68 72-48 90-32 72-14 84 8 62 18 64 40 42 46 36 68 14 64 0 82-14 64-36 68-42 46-64 40-62 18-84 8-72-14-90-32-72-48-84-68-62-78-64-100-42-106-36-128-14-124Z"/>
